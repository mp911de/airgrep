name: Timezone Database

on:
  push:
    paths:
      - 'firmware/tzdb/**'
      - 'firmware/components/airgrep/tz/**'
      - '.github/workflows/tzdb.yml'
  pull_request:
    paths:
      - 'firmware/tzdb/**'
      - 'firmware/components/airgrep/tz/**'
      - '.github/workflows/tzdb.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tzdb:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build and verify timezone table
        working-directory: firmware/tzdb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --build build --target sanitize

      - name: Upload tzdata.bin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: firmware/tzdb/build/tzdata.bin
          archive: false
          if-no-files-found: error
